^SHROOB:
    Inherits: ^HealsOnTiberium

OVSR:
    Inherits: ^Infantry
    Inherits@2: ^SHROOB
    Inherits@selection: ^SelectableSupportUnit
    Buildable:
        Queue: Infantry
        BuildPaletteOrder: 160
        Prerequisites: ~barracks, tech, ~techlevel.medium
        Description: Control centre for local Shroob forces.\n  Unarmed
    Valued:
        Cost: 2500
    Tooltip:
        Name: Overseer
    Selectable:
        DecorationBounds: 1267, 2534
    Health:
        HP: 100000
    Armor:
        Type: Heavy
    Mobile:
        Speed: 42
    RevealsShroud:
        RequiresCondition: !inside-tunnel
        Range: 6c0
        MaxHeightDelta: 3
    MustBeDestroyed:
        RequiredForShortGame: true
    BaseBuilding:
    Transforms:
        PauseOnCondition: empdisable || being-captured
        IntoActor: sacnst
        Offset: -1,-1
        Facing: 384
        TransformSounds: place2.aud
        NoTransformSounds:
        Voice: Move
        NoTransformNotification: BuildingCannotPlaceAudio
        NoTransformTextNotification: Cannot deploy here.
    RenderSprites:
        Image: CYC2

EXTR:
    Inherits: ^Infantry
    Inherits@2: ^SHROOB
    Inherits@selection: ^SelectableEconomicUnit
    Valued:
        Cost: 1400
    Tooltip:
        Name: Extractor
    Buildable:
        Queue: Infantry
        BuildPaletteOrder: 10
        Prerequisites: ~barracks, saproc, ~techlevel.low
        Description: Collects Tiberium for processing.\n  Unarmed
    Selectable:
        Bounds: 1086, 2172
        DecorationBounds: 1086, 2172
    FreeActor:
        Actor: COLL
        SpawnOffset: 2,1
        Facing: 640
    Harvester:
        DeliveryBuildings: proc, saproc, sacnst
        Capacity: 28
        Resources: Tiberium, BlueTiberium
        BaleLoadDelay: 15
        BaleUnloadDelay: 15
        FullyLoadedSpeed: 50
        SearchFromProcRadius: 36
        SearchFromHarvesterRadius: 18
        HarvestVoice: Attack
        DeliverVoice: Move
        EmptyCondition: no-tiberium
    Mobile:
        Speed: 51
    Health:
        HP: 100000
    ChangesHealth:
        Step: 500
        Delay: 10
        StartIfBelow: 50
        DamageCooldown: 200
    Armor:
        Type: Heavy
    RevealsShroud:
        RequiresCondition: !inside-tunnel
        Range: 4c0
        MaxHeightDelta: 3
    Explodes:
        RequiresCondition: !no-tiberium
        Weapon: TiberiumExplosion
    WithHarvestOverlay:
        LocalOffset: 543,0,0
        Palette: effect
    RenderSprites:
        Image: extr
    #rm WithSpriteBody once we rip out the necessity for rendering a sprite on MobileRefinery
    WithSpriteBody:
    WithHarvesterPipsDecoration:
        Position: BottomLeft
        RequiresSelection: true
        Margin: 5, 2
        PipCount: 7
        Palette: pips
        ResourceSequences:
            Tiberium: pip-green
            BlueTiberium: pip-blue
    WithDecoration@UNDERGROUND:
        Sequence: harvester
    MobileRefinery:
        #DockAngle: 640
        DockOffset: 2,2
        DockRadius: 5000
        DiscardExcessResources: true
    StoresResources:
        Capacity: 2000
    #GrantConditionOnPlayerResources:
    #    Condition: contains-tiberium
    #Explodes@2:
    #    RequiresCondition: contains-tiberium
    #    Weapon: TiberiumExplosion
    WithResourceStoragePipsDecoration:
        Position: BottomLeft
        RequiresSelection: true
        Margin: 8, 10
        FullSequence: pip-green-building
        EmptySequence: pip-empty-building
        PipStride: 0, -4
        PipCount: 9
        Palette: pips

COLL:
    Inherits: ^Infantry
    Inherits@2: ^SHROOB
    Inherits@selection: ^SelectableEconomicUnit
    Valued:
        Cost: 200
    Tooltip:
        Name: Collector
    Buildable:
        Queue: Infantry
        BuildPaletteOrder: 10
        Prerequisites: ~barracks, saproc, ~techlevel.low
        Description: Collects Tiberium for processing.\n  Unarmed
    Selectable:
        Bounds: 1086, 2172
        DecorationBounds: 1086, 2172
    Harvester:
        DeliveryBuildings: extr
        Capacity: 7
        Resources: Tiberium, BlueTiberium
        BaleLoadDelay: 15
        BaleUnloadDelay: 15
        FullyLoadedSpeed: 100
        SearchFromProcRadius: 36
        SearchFromHarvesterRadius: 18
        HarvestVoice: Attack
        DeliverVoice: Move
        EmptyCondition: no-tiberium
        MaxUnloadQueue: 8
    Mobile:
        #Speed: 71
        Speed: 180
    Health:
        HP: 1000
    ChangesHealth:
        Step: 500
        Delay: 10
        StartIfBelow: 50
        DamageCooldown: 200
    Armor:
        Type: Light
    RevealsShroud:
        RequiresCondition: !inside-tunnel
        Range: 4c0
        MaxHeightDelta: 3
    Explodes:
        RequiresCondition: !no-tiberium
        Weapon: TiberiumExplosion
    WithHarvestOverlay:
        LocalOffset: 543,0,0
        Palette: effect
    WithHarvesterPipsDecoration:
        Position: BottomLeft
        RequiresSelection: true
        Margin: 5, 2
        PipCount: 7
        Palette: pips
        ResourceSequences:
            Tiberium: pip-green
            BlueTiberium: pip-blue
    WithDecoration@UNDERGROUND:
        Sequence: harvester
